<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Farm</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые стили под тему Telegram */
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            margin: 0;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .balance { font-size: 24px; font-weight: bold; color: #4caf50; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="user-name">Привет, Игрок!</h2>
        <div class="card">
            <p>Ваш баланс:</p>
            <div class="balance"><span id="balance">0.00</span> GRAM</div>
            <p style="font-size: 12px; color: gray;">Выполнено заданий: <span id="completed-tasks">0</span></p>
        </div>
    </div>

    <h3>Доступные задания</h3>
    <div id="tasks-list">
        <p>Загрузка заданий...</p>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // ССЫЛКА НА ВАШ WORKER В CLOUDFLARE
        const API_URL = "https://crypto-farm-api.yurakozachkov1994.workers.dev";
        
        // Получаем данные инициализации (защита и авторизация)
        const initData = tg.initData || '';

        // Универсальная функция для запросов к серверу
        async function apiRequest(path, method = 'GET', body = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': initData
                }
            };
            if (body) {
                options.body = JSON.stringify(body);
            }
            const response = await fetch(`${API_URL}${path}`, options);
            return await response.json();
        }

        // Функция загрузки стартовых данных
        async function loadBootstrap() {
            try {
                const data = await apiRequest('/api/bootstrap');
                
                if (data.user) {
                    document.getElementById('user-name').innerText = `Привет, ${data.user.name}!`;
                    document.getElementById('balance').innerText = data.user.balance.toFixed(3);
                    document.getElementById('completed-tasks').innerText = data.user.completed_tasks;
                }

                const tasksContainer = document.getElementById('tasks-list');
                if (data.tasks && data.tasks.length > 0) {
                    tasksContainer.innerHTML = data.tasks.map(task => `
                        <div class="card">
                            <b>${task.title}</b><br>
                            <span style="color: #ff9800; font-weight: bold;">+${task.reward} GRAM</span><br>
                            <button class="btn" onclick="completeTask('${task.id}')">Проверить подписку</button>
                        </div>
                    `).join('');
                } else {
                    tasksContainer.innerHTML = '<p>Пока нет новых заданий.</p>';
                }

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('tasks-list').innerHTML = '<p style="color: red;">Ошибка связи с сервером. Попробуйте позже.</p>';
            }
        }

        // Функция выполнения задания
        async function completeTask(taskId) {
            try {
                const result = await apiRequest('/api/tasks/complete', 'POST', { task_id: taskId });
                
                if (result.error) {
                    tg.showAlert(result.error); // Показываем ошибку в сплывающем окне ТГ
                } else {
                    tg.showAlert(result.message); // Показываем успех
                    loadBootstrap(); // Перезагружаем интерфейс, чтобы обновить баланс
                }
            } catch (error) {
                tg.showAlert('Произошла ошибка при выполнении.');
            }
        }

        // Запускаем загрузку при открытии приложения
        window.addEventListener('DOMContentLoaded', () => {
            loadBootstrap();
        });
    </script>
</body>
</html>
